[package]
name = "ferriskey-mcp"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "ferriskey_mcp"
path = "src/lib.rs"

[[bin]]
name = "ferriskey-mcp"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
base64 = "0.22"
clap = { version = "4.5.60", features = ["env", "derive"] }
http = "1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = "1"

[dev-dependencies]
rmcp = { version = "3.6.0", features = ["client", "transport-streamable-http-client-reqwest"] }
