[package]
name = "autharie-mcp"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "autharie_mcp"
path = "src/lib.rs"

[[bin]]
name = "autharie-mcp"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5.60", features = ["env", "derive"] }
http = "1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
