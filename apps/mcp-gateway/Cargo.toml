[package]
name = "mcp-gateway"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "mcp_gateway"
path = "src/lib.rs"

[[bin]]
name = "mcp-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
bytes = "1"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["env", "derive"] }
futures-util = "0.3.31"
http = "1"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.12.24", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
