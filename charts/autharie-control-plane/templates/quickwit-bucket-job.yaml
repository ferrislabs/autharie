{{- if .Values.quickwit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "autharie-control-plane.fullname" . }}-quickwit-bucket
  labels:
    {{- include "autharie-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickwit
  annotations:
    # Same wave as autharie-migrations, and for the same reason: Sync rather
    # than PreSync so it runs after RustFS (wave -2) exists, and a fresh Job
    # on every sync rather than one ArgoCD tries to patch a Job's immutable
    # spec in place.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "autharie-control-plane.labels" . | nindent 8 }}
        app.kubernetes.io/component: quickwit
    spec:
      restartPolicy: Never
      containers:
        # Quickwit's own S3 client expects this bucket to already exist --
        # unlike autharie-s3's ensure_bucket, it never creates one itself.
        - name: create-bucket
          # The RustFS image, already pulled for the store itself: its curl
          # signs the S3 CreateBucket call (SigV4), so no separate client
          # image is needed. 409 means the bucket already exists.
          image: "{{ .Values.rustfs.image.repository }}:{{ .Values.rustfs.image.tag }}"
          command:
            - sh
            - -c
            - |
              while :; do
                code=$(curl -sS -o /tmp/response -w '%{http_code}' -X PUT \
                  --aws-sigv4 "aws:amz:$REGION:s3" --user "$ACCESS_KEY:$SECRET_KEY" \
                  "$ENDPOINT/$BUCKET")
                case "$code" in
                  200|409) exit 0 ;;
                  000) echo "waiting for the object store"; sleep 2 ;;
                  *) echo "creating $BUCKET failed with $code"; cat /tmp/response; exit 1 ;;
                esac
              done
          env:
            - name: ENDPOINT
              value: {{ include "autharie-control-plane.objectStoreEndpoint" . | quote }}
            - name: BUCKET
              value: {{ .Values.quickwit.bucket | quote }}
            - name: REGION
              value: {{ .Values.objectStore.region | quote }}
            {{- $objectStoreSecret := .Values.objectStore.existingSecret | default (printf "%s-rustfs" (include "autharie-control-plane.fullname" .)) }}
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $objectStoreSecret }}
                  key: {{ .Values.objectStore.existingSecretAccessKeyKey }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $objectStoreSecret }}
                  key: {{ .Values.objectStore.existingSecretSecretKeyKey }}
{{- end }}
