{{- if and .Values.herald.enabled .Values.herald.podDisruptionBudget.enabled (ge (int (ternary .Values.herald.keda.minReplicaCount .Values.herald.replicaCount .Values.herald.keda.enabled)) 2) }}
# Only with a floor of 2 or more: on a single replica the budget would forbid
# evicting the only pod and block every node drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "autharie-dataplane.fullname" . }}-herald
  labels:
    {{- include "autharie-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: herald
spec:
  minAvailable: {{ .Values.herald.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autharie-dataplane.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: herald
{{- end }}
