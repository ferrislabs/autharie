{{- if .Values.genesis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autharie-dataplane.fullname" . }}-genesis
  labels:
    {{- include "autharie-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: genesis
spec:
  replicas: {{ .Values.genesis.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autharie-dataplane.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: genesis
  template:
    metadata:
      labels:
        {{- include "autharie-dataplane.labels" . | nindent 8 }}
        app.kubernetes.io/component: genesis
      annotations:
        # It reads the broker connection string once, at startup.
        checksum/iggy: {{ include "autharie-dataplane.iggyUrl" . | sha256sum }}
    spec:
      # Genesis applies IdentityInstance resources, so it needs the same
      # cluster access the operator has. It writes the custom resource; the
      # operator is what turns it into workloads.
      serviceAccountName: {{ include "autharie-dataplane.fullname" . }}-genesis
      containers:
        - name: genesis
          image: {{ include "autharie-dataplane.image" (dict "root" . "component" "genesis") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: IGGY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "autharie-dataplane.fullname" . }}-iggy
                  key: url
            - name: IGGY_CONSUMER
              value: {{ .Values.genesis.consumer | quote }}
            {{- with .Values.genesis.tenantZone }}
            # The zone pooled tenants are served under. Unset, every realm
            # action is refused rather than trusting the hostname a payload
            # carries.
            - name: TENANT_ZONE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.objectStore.enabled }}
            # Where the store answers from inside this data plane. The control
            # plane sends the destination, because it owns the layout; how to
            # reach the store is local, because the two sides can be on
            # different networks. Empty means AWS, which is the only store that
            # needs no endpoint -- and that is a separate question from a data
            # plane that archives nothing, which is an absent bucket upstream.
            - name: OBJECT_STORE_ENDPOINT
              value: {{ .Values.objectStore.endpoint | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.genesis.resources | nindent 12 }}
{{- end }}
