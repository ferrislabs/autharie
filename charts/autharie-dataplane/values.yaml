# Images are published by CI as ghcr.io/ferrislabs/autharie-<component>.
image:
  registry: ghcr.io
  repository: ferrislabs
  # Empty means "use the chart's appVersion". Pin it for anything but a local
  # experiment: a data plane silently tracking :latest is a data plane whose
  # version nobody can state.
  tag: ""
  pullPolicy: IfNotPresent

# What identifies this data plane to the control plane.
dataplane:
  # Required. The id the control plane registered for this cluster; Herald
  # claims actions for it and reports its heartbeat against it.
  id: ""
  # Herald shards the deployments it owns by hashing their id. One replica per
  # shard, each with its own index.
  shard:
    id: 0
    total: 1

controlPlane:
  # Required. Reachable from inside the cluster. For a control plane running on
  # the developer's machine against a k3d cluster, that is
  # http://host.k3d.internal:3333.
  url: ""
  # How Herald authenticates. Prefer client credentials: the control plane
  # checks token expiry, so a fixed token stops working with no way for Herald
  # to recover.
  auth:
    # OIDC issuer, e.g. https://id.example/realms/autharie. Leave empty to fall
    # back to the fixed token below.
    issuer: ""
    # One client per data plane, not one for the fleet. The control plane
    # creates it when the data plane is registered and answers with its id and
    # secret, once -- so this is `herald-<data plane id>` rather than a name
    # every cluster shares.
    clientId: herald-service
    clientSecret: ""

  # A fixed bearer token. Fine for a short local run, wrong for anything that
  # outlives it.
  #
  # `token` and `auth.clientSecret` are written into a Secret by this chart;
  # `existingSecret` points at one you manage instead. Never both.
  token: ""
  existingSecret: ""
  existingSecretKey: token
  existingSecretClientSecretKey: client-secret

herald:
  enabled: true
  # Only the replica count when KEDA is off. With KEDA on (see `herald.keda`
  # below) the Deployment carries no `replicas` at all: KEDA
  # owns it, and a value pinned here would be re-applied by every helm
  # upgrade against the autoscaler.
  replicaCount: 1
  # Keeps Herald from staying down. Something scaling the Deployment to 0,
  # by hand or by mistake, is otherwise final: nothing in the chart restores
  # it. The ScaledObject holds a floor of `minReplicaCount`, and KEDA brings
  # the Deployment back from 0 to that floor.
  #
  # Herald shards the deployments it owns by hashing their id, one replica
  # per shard, so a second replica is not extra capacity: it is a second
  # claimant of the same shard. The ceiling therefore equals the floor, and
  # KEDA is here as a floor, not as an autoscaler.
  # KEDA is a prerequisite of the cluster, installed before this chart:
  #   helm install keda kedacore/keda -n keda --create-namespace
  # A ScaledObject cannot be created by the release that installs the CRD
  # defining it, so the chart does not bring KEDA itself. Set `enabled: false`
  # on a cluster that has none; Herald then keeps `replicaCount` and nothing
  # restores it if it is scaled down.
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 1
    # A ScaledObject needs a trigger. A cpu trigger with a high threshold is
    # the neutral one for a pure floor: it needs no external system, has no
    # schedule window (a cron trigger leaves a gap between its end and its
    # next start, where the floor would not hold), and with the ceiling
    # equal to the floor it can never ask for more than the floor. It reads
    # the container's cpu request, which `resources` sets. Replace the list
    # wholesale to use another trigger.
    triggers:
      - type: cpu
        metricType: Utilization
        metadata:
          value: "90"
  # A PodDisruptionBudget on a single replica forbids evicting it, which
  # blocks every node drain. It therefore renders only when the configured
  # floor is 2 or more, and is off by default.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  pollIntervalSeconds: 15
  claim:
    max: 50
    leaseSeconds: 60
  # Where the search index answers, reachable from this cluster. Empty is a
  # legitimate state and the default: shipping is simply off, and the live tail
  # works exactly as it did before this existed.
  logIndex:
    url: ""
  # The OTLP trace receiver, both transports the spec allows -- HTTP and
  # gRPC are independent doors onto the same pipeline, opened together by
  # this one flag. Both matter in practice: FerrisKey's own OTLP exporter,
  # confirmed against a live instance, defaults to gRPC rather than HTTP.
  # Off by default and independent of `logIndex.url` being set: a Herald
  # with nowhere to ship what it accepts has nothing to gain from accepting
  # it at all, so both must be set before traces are shipped anywhere -- the
  # same "off unless configured" shape as log shipping itself.
  otlp:
    enabled: false
    port: 4318
    grpcPort: 4317
  # Herald's own HTTP endpoint, always on. The one port is used for both the
  # container port and HEALTH_LISTEN_ADDR so they cannot drift apart.
  health:
    port: 8081
  # Lets Kubernetes restart a Herald whose main loop stopped. /healthz answers
  # 200 while the loop has started a cycle within max(3 x pollIntervalSeconds,
  # 60 s), whether that cycle succeeded or failed, and 503 otherwise. It never
  # looks at the control plane, RabbitMQ, the Kubernetes API or Quickwit: a
  # Herald that cannot reach them is degraded, not dead, and restarting it
  # would not help and would drop the OTLP traces it is receiving.
  # /readyz is 200 once the loop has started one cycle, and is likewise
  # independent of the control plane.
  # Liveness periodSeconds x failureThreshold must stay above that 60 s bound,
  # so a slow cycle is not killed.
  probes:
    enabled: true
    timeoutSeconds: 3
    startup:
      periodSeconds: 5
      failureThreshold: 60
    liveness:
      periodSeconds: 20
      failureThreshold: 6
    readiness:
      periodSeconds: 10
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

genesis:
  enabled: true
  replicaCount: 1
  # The name Genesis reads the actions topic under. The broker keeps how far
  # it got by this name, so changing it replays every action still retained.
  consumer: genesis
  # DNS zone of pooled tenants ({realm}.{zone}); empty refuses realm actions.
  tenantZone: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

operator:
  enabled: true
  replicaCount: 1
  logFilter: info
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# The CloudNativePG cluster every free deployment's database lives on (ADR
# 0006). A free deployment is a FerrisKey of its own, but a cluster of its own
# per tenant is what makes a free offer unaffordable, so they share this one:
# one database and one role each, created by the operator as superuser.
#
# CloudNativePG is a cluster prerequisite, like the Gateway controller: this
# chart declares the Cluster, it does not install the operator. Set `enabled:
# false` on a data plane that hosts no free deployment, or where the CRD is
# absent, and the Cluster and the operator's coordinates for it go away.
#
# One instance on purpose: it is a point of failure for every free tenant of
# this data plane, accepted for the free offer. The daily dumps are the
# recovery, not replicas.
sharedDatabase:
  enabled: true
  instances: 1
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  postgresql:
    # What bounds how many free deployments one data plane carries. The
    # operator sets no pool size on a FerrisKey API, so each free deployment
    # holds the pool FerrisKey defaults to, assumed to be 20 connections
    # (check it again when the FerrisKey image moves).
    #   300 max_connections
    #   - 3  superuser_reserved_connections (PostgreSQL default)
    #   - 10 kept for CloudNativePG itself, the operator's role/database SQL,
    #        and the migration and dump Jobs, which connect beside the API
    #   = 287 usable, / 20 per FerrisKey = 14 free deployments.
    # Raise max_connections together with the memory limit above: every
    # connection costs a backend process, roughly 5-10 MiB.
    maxConnections: 300

# The message bus between Herald and Genesis: a single-node Apache Iggy.
# Messages are written to disk before a publish returns, so a broker restart
# loses nothing that was acknowledged -- provided `persistence` is on.
#
# Point `externalUrl` at a broker of your own (an iggy:// connection string,
# credentials included) and set `enabled: false` to use one.
iggy:
  enabled: true
  # The SDK in Herald and Genesis is pinned to the release that speaks to this
  # server; move both together.
  image: apache/iggy:0.9.0
  externalUrl: ""
  auth:
    username: autharie
    # Read once, on the broker's first start: it stores the root user on its
    # volume and ignores this value afterwards. Changing it on an installed
    # data plane needs the volume emptied as well.
    password: autharie
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

# The shared edge every managed instance is served through. Envoy Gateway
# provisions one Envoy deployment per Gateway, so this data plane runs one and
# tenant routes attach to it.
#
# Envoy Gateway itself is a cluster prerequisite, like CloudNativePG: this
# chart declares the Gateway, it does not install the controller.
gateway:
  enabled: true
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  replicaCount: 1
  service:
    # Every instance is served through a route now, so the Gateway is the edge
    # and takes the node's ports. A cluster still running an ingress
    # controller on 80 has to lose it, or this service stays Pending: two
    # LoadBalancers cannot both hold the port, and the loser says nothing.
    type: LoadBalancer
  tls:
    # A Secret holding the certificate for the HTTPS listener. Empty means no
    # HTTPS listener at all, rather than one that terminates with nothing:
    # a listener that cannot resolve its certificate takes the whole Gateway
    # out of Programmed, including the plain HTTP listener beside it.
    secretName: ""
    # Whether Herald keeps secretName's contents current from what the
    # control plane distributes over the heartbeat. False leaves this
    # exactly what it always was: bring your own secret, unmanaged by
    # Herald -- true only makes sense alongside a secretName Herald is free
    # to overwrite, never one holding a certificate issued some other way.
    managed: false
  # The host port a browser actually reaches the HTTPS listener on, when it
  # is not really 443 -- a local cluster remapping it because a container
  # cannot bind the real one. Empty is the common case (a real ingress
  # terminating 443 as 443), and every provisioned instance's webapp/API
  # URLs default to a bare hostname, exactly the same as a production
  # domain would. Set only for local development.
  publicHttpsPort: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

nameOverride: ""
fullnameOverride: ""

# Where this data plane archives the databases it hosts.
#
# Disabled means this data plane backs nothing up, which is a decision rather
# than an oversight: the operator logs it once at startup and carries on. It is
# a different state from a store being unreachable, and the two are reported
# differently.
#
# The credentials live in a secret this chart does not create. It holds
# ACCESS_KEY_ID and ACCESS_SECRET_KEY, and the operator copies it into each
# tenant namespace because CloudNativePG resolves secret references inside the
# cluster's own namespace.
objectStore:
  enabled: false
  # Where the store answers. Empty means AWS, which is the only one that needs
  # no endpoint.
  endpoint: ""
  # Signed into every request. Self hosted stores mostly ignore which region it
  # is and mind very much that there is one.
  region: us-east-1
  credentialsSecret: autharie-object-store

