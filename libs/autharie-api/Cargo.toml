[package]
name = "autharie-api"
description = "Api library for Autharie"
version.workspace = true
authors.workspace = true
edition.workspace = true


[dependencies]
chrono-tz = "0.10"
autharie-core = { path = "../autharie-core" }
autharie-auth = { path = "../autharie-auth" }
autharie-s3 = { path = "../autharie-s3" }
autharie-transit = { path = "../autharie-transit" }
autharie-ovh = { path = "../autharie-ovh" }
kube = { version = "2.0.1", features = ["client"] }
k8s-openapi = { version = "0.26.0", features = ["latest"] }
axum = "0.8.8"
futures = "0.3.31"
axum-extra = { version = "0.12.5", features = ["typed-routing"] }
clap = { version = "4.5.54", features = ["env", "derive"] }
serde = "1.0.228"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.19.0", features = ["serde"] }
axum-server = "0.8.0"
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
chrono = { version = "0.4.42", features = ["serde"] }
reqwest = { version = "0.12.24", features = ["json"] }
serde_json = "1.0.145"

[dev-dependencies]
# Driving the router in a test, to assert what it does and does not serve.
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.19.0", features = ["v4"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres"] }
httpmock = "0.7.0"
