[package]
name = "autharie-e2e"
description = "Cross-crate tests of flows that only share JSON and the CRD types"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish = false

[dependencies]
autharie-auth = { path = "../autharie-auth" }
autharie-core = { path = "../autharie-core" }
autharie-crds = { path = "../autharie-crds" }
autharie-domain = { path = "../autharie-domain" }
autharie-operator-core = { path = "../autharie-operator-core" }
genesis-core = { path = "../genesis-core" }
herald-core = { path = "../herald-core" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
cucumber = "0.23"
proptest = "1.11.0"
